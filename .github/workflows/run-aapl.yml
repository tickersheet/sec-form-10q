name: Test AAPL SEC Data

on:
  workflow_dispatch:

jobs:
  get-sec-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run SEC script
        run: python scripts/get_aapl_10q.py

      - name: Save AAPL data to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/AAPL.csv
          git commit -m "Update AAPL financial data" || echo "No changes to commit"
          git push
